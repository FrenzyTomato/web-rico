<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board-scale Blender market</title><style>*{box-sizing:border-box}body{margin:0;background:#19383b;color:#f7edda;font:15px system-ui}header{position:absolute;top:28px;left:32px;pointer-events:none;z-index:1}small{letter-spacing:3px;color:#e1b668}h1{font:34px Georgia;margin:12px 0}p{color:#b4ccc7;line-height:1.6}#stage{height:100vh;min-height:540px}footer{position:absolute;bottom:24px;left:32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a{background:#2b5354;border:1px solid #73938a;border-radius:24px;color:#fff0d3;padding:12px 18px;text-decoration:none;cursor:pointer}#status{font-size:12px;color:#bdd0c9}button[aria-pressed=true]{background:#d9ae64;color:#19383b}</style><header><small>VIBE RICO / BOARD-SCALE VERSION</small><h1>The same market, less weight.</h1><p>Drag to rotate · scroll to zoom<br>Real geometry, curved awnings and simple textured materials.</p></header><div id="stage" aria-label="Interactive fully rotatable Blender market model"></div><footer><button id="spin" aria-pressed="false">Auto rotate</button><button id="reset">Reset view</button><a href="/art/blender-market/market-lite.glb" download>Download lite GLB</a><a href="/blender-market-preview.html">Original model</a><span id="status">Loading Blender model…</span></footer><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const holder=document.querySelector('#stage'),status=document.querySelector('#status');
try{const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;holder.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#19383b');const camera=new T.PerspectiveCamera(36,1,.1,100);camera.position.set(4,3.2,5);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.8,0);controls.enableDamping=false;controls.minDistance=3;controls.maxDistance=12;controls.maxPolarAngle=Math.PI*.49;
scene.add(new T.HemisphereLight('#fff3da','#30565b',1.7));const light=new T.DirectionalLight('#fff0d7',2.5);light.position.set(-3,7,4);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-5,right:5,top:5,bottom:-5});light.shadow.normalBias=.02;scene.add(light);const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#28494a',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;floor.receiveShadow=true;scene.add(floor);
const gltf=await new GLTFLoader().loadAsync('/art/blender-market/market-lite.glb');const model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(model);
const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);new ResizeObserver(()=>{renderer.setSize(holder.clientWidth,holder.clientHeight);camera.aspect=holder.clientWidth/holder.clientHeight;camera.updateProjectionMatrix();render()}).observe(holder);controls.update();const stats=await(await fetch('/art/blender-market/stats-lite.json')).json();status.textContent=`${stats.triangles.toLocaleString()} triangles · ${(stats.glbBytes/1048576).toFixed(1)} MB · Blender → GLB → Three.js`;
let rotating=false,frame=0,last=0;function tick(now){if(!rotating)return;model.rotation.y+=Math.min((now-last)/1000,.05)*.35;last=now;render();frame=requestAnimationFrame(tick)}document.querySelector('#spin').onclick=()=>{rotating=!rotating;document.querySelector('#spin').setAttribute('aria-pressed',rotating);if(rotating){last=performance.now();frame=requestAnimationFrame(tick)}else cancelAnimationFrame(frame)};document.querySelector('#reset').onclick=()=>{model.rotation.y=0;camera.position.set(4,3.2,5);controls.target.set(0,.8,0);controls.update();render()};render();
}catch(e){status.textContent='Preview unavailable: '+e.message;console.error(e)}
</script></html>
