<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Texture comparison</title><style>*{box-sizing:border-box}body{margin:0;background:#19383b;color:#f7edda;font:15px system-ui}header{position:absolute;top:28px;left:32px;pointer-events:none;z-index:1}small{letter-spacing:3px;color:#e1b668}h1{font:34px Georgia;margin:12px 0}p{color:#b4ccc7;line-height:1.6}#stage{height:100vh;min-height:540px}footer{position:absolute;bottom:24px;left:32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button,a{background:#2b5354;border:1px solid #73938a;border-radius:24px;color:#fff0d3;padding:12px 18px;text-decoration:none;cursor:pointer}#status{font-size:12px;color:#bdd0c9}button[aria-pressed=true]{background:#d9ae64;color:#19383b}</style><header><small>VIBE RICO / IMAGE TO 3D</small><h1>Texture comparison.</h1><p>Drag to rotate · scroll to zoom<br>Same geometry · compressed textures or original backup</p></header><div id="stage" aria-label="Interactive building model"></div><footer><button id="spin" aria-pressed="false">Auto rotate</button><button id="reset">Reset view</button><label for="building">Building </label><select id="building"><option>Small Market</option><option>Banana Estate</option><option>Worker 01</option><option>Corn Crate</option><option>Captain Command Tile</option></select><span id="status">Loading building…</span></footer><script type="module">
import {KTX2Loader} from 'three/addons/loaders/KTX2Loader.js';import {decodeModel} from './src/scene/modelBytes.ts';import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const names=["Small Market", "Banana Estate", "Worker 01", "Corn Crate", "Captain Command Tile"];const requested=new URLSearchParams(location.search).get('asset');const asset=names.includes(requested)?requested:names[0];const selector=document.querySelector('#building');selector.value=asset;const original=new URLSearchParams(location.search).get('art')==='original';selector.onchange=()=>{location.search='?asset='+encodeURIComponent(selector.value)+(original?'&art=original':'')};const switcher=document.createElement('button');switcher.textContent=original?'Use compressed textures':'Use original textures';switcher.onclick=()=>{location.search='?asset='+encodeURIComponent(asset)+(original?'':'&art=original')};document.querySelector('footer').append(switcher);
const holder=document.querySelector('#stage'),status=document.querySelector('#status');
try{const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;holder.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#19383b');const camera=new T.PerspectiveCamera(36,1,.1,100);camera.position.set(3.2,2.8,4.2);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.5,0);controls.enableDamping=false;controls.minDistance=1.8;controls.maxDistance=12;controls.maxPolarAngle=Math.PI*.49;
scene.add(new T.HemisphereLight('#fff3da','#30565b',1.7));const light=new T.DirectionalLight('#fff0d7',2.5);light.position.set(-3,7,4);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-5,right:5,top:5,bottom:-5});light.shadow.normalBias=.02;scene.add(light);const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#28494a',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;floor.receiveShadow=true;scene.add(floor);
const loader=new GLTFLoader();if(!original)loader.setKTX2Loader(new KTX2Loader().setTranscoderPath('/art/basis/').setWorkerLimit(2).detectSupport(renderer));const response=await fetch('/art/'+(original?'runtime':'runtime-ktx2')+'/'+encodeURIComponent(asset)+'.glb.gz');if(!response.ok)throw Error('Asset unavailable');const gltf=await loader.parseAsync(await decodeModel(await response.arrayBuffer()),'');const model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});const bounds=new T.Box3().setFromObject(model);const size=bounds.getSize(new T.Vector3());const scale=2/Math.max(size.x,size.y,size.z);model.scale.multiplyScalar(scale);bounds.setFromObject(model);const center=bounds.getCenter(new T.Vector3());model.position.set(-center.x,-bounds.min.y,-center.z);scene.add(model);
const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);new ResizeObserver(()=>{renderer.setSize(holder.clientWidth,holder.clientHeight);camera.aspect=holder.clientWidth/holder.clientHeight;camera.updateProjectionMatrix();render()}).observe(holder);controls.update();const textures=new Set();model.traverse(o=>{if(o.isMesh)for(const mat of (Array.isArray(o.material)?o.material:[o.material]))for(const v of Object.values(mat))if(v?.isTexture)textures.add(v)});let gpu=0;for(const t of textures)gpu+=t.isCompressedTexture?t.mipmaps.reduce((s,m)=>s+m.data.byteLength,0):t.image.width*t.image.height*4*4/3;status.textContent=`${original?'Original':'Compressed'} · ${asset} · ${(gpu/1e6).toFixed(2)} MB texture payload`;
let rotating=false,frame=0,last=0;function tick(now){if(!rotating)return;model.rotation.y+=Math.min((now-last)/1000,.05)*.35;last=now;render();frame=requestAnimationFrame(tick)}document.querySelector('#spin').onclick=()=>{rotating=!rotating;document.querySelector('#spin').setAttribute('aria-pressed',rotating);if(rotating){last=performance.now();frame=requestAnimationFrame(tick)}else cancelAnimationFrame(frame)};document.querySelector('#reset').onclick=()=>{model.rotation.y=0;camera.position.set(3.2,2.8,4.2);controls.target.set(0,.5,0);controls.update();render()};render();
}catch(e){status.textContent='Preview unavailable: '+e.message;console.error(e)}
</script></html>
